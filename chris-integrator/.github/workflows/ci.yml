name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pure-python:
    name: pure Python ${{ matrix.python }}${{ matrix.mapper && ', with chris-mapper' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        mapper: [false]
        include:
          - python: "3.14"
            mapper: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: the map box (public repository)
        if: matrix.mapper
        uses: actions/checkout@v4
        with:
          repository: PiotrTopa/chris-mapper
          path: _deps/chris-mapper
      - name: install
        env:
          CHRIS_NATIVE_BUILD: "0"
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"
          if [ "${{ matrix.mapper }}" = "true" ]; then python -m pip install ./_deps/chris-mapper; fi
      - name: implementation in use
        run: cd "$RUNNER_TEMP" && python -m chris_integrator.native || true   # exit 3 = pure Python in use, which is what this job tests
      - name: tests (the installed package, pure Python)
        env:
          CHRIS_NATIVE: "0"
        run: |
          mkdir -p "$RUNNER_TEMP/t" && cp -r tests "$RUNNER_TEMP/t/"
          cd "$RUNNER_TEMP/t" && python -m pytest -q -p no:cacheprovider tests

  native:
    name: native core, Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: install (builds the optional extension)
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]" -v 2>&1 | tail -n 5
      - name: the extension is built and passes its self-test
        run: |
          cd "$RUNNER_TEMP"
          python -c "import chris_integrator.native as n, sys; s = n.status(); print(s); sys.exit(0 if s['active'] else 1)"
          python -m chris_integrator.native
      - name: in-tree build (native/build.sh) and the native tests
        run: |
          sh native/build.sh
          python -m pytest -q -p no:cacheprovider tests/test_native.py tests/test_exact_savings.py
      - name: address and undefined-behaviour sanitizers
        run: |
          SANITIZE=1 sh native/build.sh
          ASAN_OPTIONS=detect_leaks=0 LD_PRELOAD="$(cc -print-file-name=libasan.so)" \
            python -m pytest -q -p no:cacheprovider tests/test_native.py
      - name: whole suite with the native core
        run: |
          sh native/build.sh
          python -m pytest -q -p no:cacheprovider tests

  package:
    name: sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true
      - run: python -m pip install build
      - run: python -m build
      - name: the sdist builds a pure-Python wheel without a compiler
        run: |
          CHRIS_NATIVE_BUILD=0 python -m pip wheel --no-deps -w "$RUNNER_TEMP/w" dist/*.tar.gz
          ls "$RUNNER_TEMP/w"

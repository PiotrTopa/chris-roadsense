[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chris-integrator"
dynamic = ["version"]
description = "Data integrator of the chris car perception stack: every sensor in, one consistent picture out"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Piotr Topa" }]
requires-python = ">=3.10"
dependencies = ["numpy"]
keywords = ["sensor fusion", "kalman filter", "fault detection", "automotive", "perception", "openpilot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
http = ["aiohttp"]          # the consolidated HTTP / WebSocket API (io/http.py)
map = ["chris-mapper"]      # the map box (not on PyPI: install it from its repository, README "Installing")
test = ["pytest", "aiohttp"]

[project.urls]
Homepage = "https://github.com/PiotrTopa/chris-integrator"
Issues = "https://github.com/PiotrTopa/chris-integrator/issues"
"Map box" = "https://github.com/PiotrTopa/chris-mapper"
"Camera perception" = "https://github.com/PiotrTopa/roadsense"

[project.scripts]
chris-integrator = "chris_integrator.daemon:main"

[tool.setuptools.dynamic]
version = { attr = "chris_integrator.__version__" }

[tool.setuptools.packages.find]
include = ["chris_integrator*"]

[tool.setuptools.package-data]
chris_integrator = ["trackers/rules/*.json", "native/src/*.c"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

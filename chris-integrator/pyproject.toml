[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chris-integrator"
version = "0.1.0"
description = "Data integrator of the chris car perception stack: every sensor in, one consistent picture out"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.scripts]
chris-integrator = "chris_integrator.daemon:main"

[tool.setuptools.packages.find]
include = ["chris_integrator*"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chris-mapper"
version = "0.1.0"
description = "Map box of the chris car perception stack: a pose in, the map match and the map context out"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.scripts]
chris-mapper = "chris_mapper.__main__:main"

[tool.setuptools.packages.find]
include = ["chris_mapper*"]

[tool.setuptools.package-data]
chris_mapper = ["limits/*.json"]
